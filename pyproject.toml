[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netaudit"
version = "0.1.0"
description = "Configuration hardening auditor for FortiGate and Cisco IOS with SARIF output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leonardo Araya" }]
keywords = ["security", "network", "hardening", "fortigate", "cisco", "sarif"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "pre-commit>=4.0",
]

[project.scripts]
netaudit = "netaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

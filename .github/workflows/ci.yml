name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  quality:
    name: lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . --output-format github
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=netaudit --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: The tool must pass on its own sample configs
        run: |
          netaudit scan tests/fixtures/cisco_good.conf --fail-under 80
          netaudit scan tests/fixtures/fortigate_good.conf --fail-under 80

  container:
    name: build, smoke test and scan the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t netaudit:ci .
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 netaudit:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz >/dev/null && break
            sleep 2
          done
          curl -fsS localhost:8000/healthz
          docker logs smoke
          docker rm -f smoke
      - name: Trivy SARIF (never fails the job)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" image \
            --format sarif --output trivy.sarif \
            --severity HIGH,CRITICAL --ignore-unfixed \
            netaudit:ci
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      - name: Gate on HIGH and CRITICAL
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            "$TRIVY_IMAGE" image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --format table netaudit:ci

  self-scan:
    name: netaudit audits its own sample configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Emit SARIF for both vendors
        run: |
          netaudit scan tests/fixtures/fortigate_bad.conf --format sarif > fortigate.sarif
          netaudit scan tests/fixtures/cisco_bad.conf --format sarif > cisco.sarif
      - name: Merge into one run
        run: |
          python3 - <<'PY'
          import json

          with open("fortigate.sarif") as handle:
              document = json.load(handle)

          rules = []
          results = []
          for name in ("fortigate.sarif", "cisco.sarif"):
              with open(name) as handle:
                  run = json.load(handle)["runs"][0]
              rules += run["tool"]["driver"]["rules"]
              results += run["results"]

          run = document["runs"][0]
          run["tool"]["driver"]["rules"] = rules
          run["results"] = results

          declared = {rule["id"] for rule in rules}
          missing = {result["ruleId"] for result in results} - declared
          if missing:
              raise SystemExit(f"results without a rule definition: {sorted(missing)}")

          with open("netaudit.sarif", "w") as handle:
              json.dump(document, handle, indent=2)
          print(f"{len(results)} findings over {len(rules)} rules")
          PY
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: netaudit.sarif
          category: netaudit-self

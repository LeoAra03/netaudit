name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . --output-format github
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=netaudit --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: The tool must pass on its own sample configs
        run: |
          netaudit scan tests/fixtures/cisco_good.conf --fail-under 80
          netaudit scan tests/fixtures/fortigate_good.conf --fail-under 80

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netaudit:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 netaudit:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz >/dev/null && break
            sleep 2
          done
          curl -fsS localhost:8000/healthz
          docker logs smoke
          docker rm -f smoke
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: netaudit:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  self-scan:
    name: netaudit audits its own sample configs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Emit SARIF for both vendors
        run: |
          netaudit scan tests/fixtures/fortigate_bad.conf --format sarif > fortigate.sarif
          netaudit scan tests/fixtures/cisco_bad.conf --format sarif > cisco.sarif
      - name: Merge into one run
        run: |
          python3 - <<'PY'
          import json

          with open("fortigate.sarif") as handle:
              document = json.load(handle)

          rules = []
          results = []
          for name in ("fortigate.sarif", "cisco.sarif"):
              with open(name) as handle:
                  run = json.load(handle)["runs"][0]
              rules += run["tool"]["driver"]["rules"]
              results += run["results"]

          # One (tool, category) per upload, so both vendors share a single run.
          run = document["runs"][0]
          run["tool"]["driver"]["rules"] = rules
          run["results"] = results

          declared = {rule["id"] for rule in rules}
          missing = {result["ruleId"] for result in results} - declared
          if missing:
              raise SystemExit(f"results without a rule definition: {sorted(missing)}")

          with open("netaudit.sarif", "w") as handle:
              json.dump(document, handle, indent=2)
          print(f"{len(results)} findings over {len(rules)} rules")
          PY
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: netaudit.sarif

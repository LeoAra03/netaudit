config system global
    set hostname fw-lab
    set admin-telnet enable
    set admin-https-ssl-versions tlsv1-0
end
config system password-policy
    set status disable
end
config system interface
    edit "port1"
        set allowaccess ping http https ssh
    next
    edit "port2"
        set allowaccess ping https ssh
    next
end
config system snmp community
    edit "snmp-defaults"
        set name public
        set query-v1 enable
    next
end
config system admin
    edit "admin"
        set trusthost1 0.0.0.0 0.0.0.0
    next
end
config log setting
    set status disable
end
config firewall policy
    edit 1
        set srcaddr all
        set dstaddr all
        set action accept
    next
end

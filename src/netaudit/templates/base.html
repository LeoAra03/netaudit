<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetAudit{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
           background: #0d1117; color: #e6edf3; }
    main { max-width: 880px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: 1.4rem; letter-spacing: -.01em; }
    a { color: #58a6ff; }
    .card { border: 1px solid #30363d; border-radius: 10px; padding: 1.25rem; margin: 1rem 0; }
    .sev { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .08em;
           padding: .15rem .5rem; border-radius: 999px; }
    .CRITICAL, .HIGH { background: #6e1b1b; color: #ffb3b3; }
    .MEDIUM { background: #6b4b12; color: #ffd899; }
    .LOW, .INFO { background: #1b3a2f; color: #9be3c0; }
    code { background: #161b22; padding: .1rem .35rem; border-radius: 4px; font-size: .85em;
           word-break: break-all; }
    input, select, button { font: inherit; }
    button { background: #238636; color: #fff; border: 0; border-radius: 6px;
             padding: .55rem 1rem; cursor: pointer; }
    .muted { opacity: .65; font-size: .85rem; }
    .score { font-size: 2.6rem; font-weight: 800; margin: .25rem 0; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #21262d; }
  </style>
</head>
<body><main>
  <h1><a href="/" style="text-decoration:none;color:inherit">NetAudit</a></h1>
  {% block content %}{% endblock %}
  <p class="muted">Files are parsed in memory, stored locally in SQLite, and never executed.</p>
</main></body>
</html>
